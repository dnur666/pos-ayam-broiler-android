
name: Build APK POS Ayam Broiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web app and Capacitor
        run: |
          mkdir -p www
          unzip -o pos_ayam_broiler_gratis_paket.zip -d www
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          npx cap init "POS Ayam Broiler" "com.posayambroiler.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS-Ayam-Broiler-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

name: Build POS Ayam Broiler APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instal dependensi
        run: npm install

      - name: Bangun aplikasi web
        run: npm run build

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV

      - name: Tambahkan platform Android
        run: npx cap add android

      - name: Salin aplikasi ke Android
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasir-ayam-broiler-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
